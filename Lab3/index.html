<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laborator JavaScript - Obiecte, Funcții și Metode</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #555;
        }

        .game {
            text-align: center;
            margin-top: 30px;
        }

        .buttons {
            margin: 25px 0;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .info {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info p {
            font-size: 18px;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .score {
            background-color: #eeeeee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .score p {
            font-size: 18px;
        }

        #newGame {
            background-color: #777;
            margin-top: 15px;
        }

        #newGame:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Laborator JavaScript</h1>

        <h2>Piatra, Hârtia, Foarfeca</h2>

        <div class="game">

            <p>Alege una dintre variante:</p>

            <div class="buttons">

                <button id="rock">
                    Piatra
                </button>

                <button id="paper">
                    Hârtia
                </button>

                <button id="scissors">
                    Foarfeca
                </button>

            </div>


            <div class="info">

                <p>
                    <strong>Alegerea ta:</strong>
                    <span id="playerChoice">-</span>
                </p>

                <p>
                    <strong>Alegerea calculatorului:</strong>
                    <span id="computerChoice">-</span>
                </p>

            </div>


            <div id="result">
                Alege o variantă pentru a începe jocul!
            </div>


            <div class="score">

                <h3>Scor</h3>

                <p>
                    Tu:
                    <span id="playerScore">0</span>
                </p>

                <p>
                    Calculator:
                    <span id="computerScore">0</span>
                </p>

                <p>
                    Egalități:
                    <span id="drawScore">0</span>
                </p>

                <p>
                    Runde jucate:
                    <span id="rounds">0</span>
                </p>

            </div>


            <button id="newGame">
                Joc nou
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
